<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodruff Pictures</title>
<style>
  :root { --bg:#f7f5f0; --card:#fff; --text:#1f2328; --muted:#656d76; --line:#e2ddd2; --accent:#a51d24; --on-accent:#fff; --danger:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#080b10; --card:#121822; --text:#f2f4f7; --muted:#93a1b4; --line:#2a3544; --accent:#e5484d; --on-accent:#ffffff; --danger:#ff7b72; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
  h1 { font-size:18px; margin:0 auto 0 0; }
  select, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  button.danger { color:var(--danger); }
  main { max-width:960px; margin:0 auto; padding:16px; }
  #path { color:var(--muted); word-break:break-all; margin:0 0 12px; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:20px; text-align:center; color:var(--muted); margin-bottom:16px; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  ul { list-style:none; padding:0; margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  li { display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  li .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .name a { color:inherit; text-decoration:none; }
  li .name a:hover { color:var(--accent); }
  li .meta { color:var(--muted); font-size:13px; white-space:nowrap; }
  li .acts { display:flex; gap:6px; }
  li .acts button, li .acts a { font-size:13px; padding:4px 10px; }
  li .acts a { border:1px solid var(--line); border-radius:8px; color:inherit; text-decoration:none; }
  .uploads { margin-bottom:16px; }
  .up { display:flex; gap:10px; align-items:center; font-size:13px; margin:4px 0; }
  .up .bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .up .bar i { display:block; height:100%; background:var(--accent); width:0; }
  .err { color:var(--danger); }
  @media (max-width:600px) { li .meta { display:none; } }
</style>
</head>
<body>
<header>
  <h1><span style="color:var(--accent)">&#9654;</span> Woodruff Pictures</h1>
  <select id="roots" aria-label="Storage"></select>
  <button id="up">Up</button>
  <button id="mkdir">New folder</button>
  <button id="pick" class="primary">Upload files</button>
  <input id="file" type="file" multiple hidden>
</header>
<main>
  <p id="path"></p>
  <div id="drop">Drop files here to send them to the TV.<br><small>On iPhone: tap <b>Upload files</b>, then <b>Browse</b> for iCloud Drive or <b>Photo Library</b>.</small></div>
  <div class="uploads" id="uploads"></div>
  <ul id="list"></ul>
</main>
<script>
(function () {
  var cwd = null, parent = null;
  var el = function (id) { return document.getElementById(id); };

  function fmt(b) {
    if (b < 1024) return b + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
    return (b >= 100 ? b.toFixed(0) : b.toFixed(1)) + ' ' + u[i];
  }
  function api(url, opts) {
    return fetch(url, opts).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || r.statusText); });
      return r.json();
    });
  }
  function q(path) { return encodeURIComponent(path); }

  function load(path) {
    api('/api/list?path=' + q(path)).then(function (d) {
      cwd = d.path; parent = d.parent;
      el('path').textContent = cwd;
      el('up').disabled = !parent;
      var list = el('list'); list.innerHTML = '';
      if (!d.files.length) { list.innerHTML = '<li class="meta">This folder is empty</li>'; }
      d.files.forEach(function (f) {
        var li = document.createElement('li');
        var name = document.createElement('span'); name.className = 'name';
        var a = document.createElement('a');
        a.textContent = (f.dir ? '📁 ' : '📄 ') + f.name;
        if (f.dir) { a.href = '#'; a.onclick = function (e) { e.preventDefault(); load(f.path); }; }
        else { a.href = '/api/download?path=' + q(f.path); a.setAttribute('download', f.name); }
        name.appendChild(a);
        var meta = document.createElement('span'); meta.className = 'meta';
        meta.textContent = (f.dir ? '' : fmt(f.size) + ' · ') + new Date(f.modified).toLocaleString();
        var acts = document.createElement('span'); acts.className = 'acts';
        var del = document.createElement('button'); del.className = 'danger'; del.textContent = 'Delete';
        del.onclick = function () {
          if (!confirm('Delete "' + f.name + '" from the TV?' + (f.dir ? ' Everything inside it will be deleted too.' : ''))) return;
          api('/api/delete?path=' + q(f.path), { method: 'POST' }).then(function () { load(cwd); }, alertErr);
        };
        acts.appendChild(del);
        li.appendChild(name); li.appendChild(meta); li.appendChild(acts);
        list.appendChild(li);
      });
    }, alertErr);
  }
  function alertErr(e) { alert(e.message || e); }

  function upload(files) {
    var queue = Array.prototype.slice.call(files);
    var target = cwd;
    function next() {
      var f = queue.shift();
      if (!f) { load(cwd); return; }
      var row = document.createElement('div'); row.className = 'up';
      var label = document.createElement('span'); label.textContent = f.name;
      var bar = document.createElement('div'); bar.className = 'bar'; var fill = document.createElement('i'); bar.appendChild(fill);
      var pct = document.createElement('span'); pct.textContent = '0%';
      row.appendChild(label); row.appendChild(bar); row.appendChild(pct);
      el('uploads').appendChild(row);
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?path=' + q(target) + '&name=' + q(f.name));
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var p = Math.round(e.loaded * 100 / e.total);
        fill.style.width = p + '%'; pct.textContent = p + '%';
      };
      xhr.onload = function () {
        if (xhr.status === 200) { pct.textContent = 'Done'; setTimeout(function () { row.remove(); }, 3000); }
        else { pct.textContent = 'Failed: ' + xhr.responseText; pct.className = 'err'; }
        next();
      };
      xhr.onerror = function () { pct.textContent = 'Connection lost'; pct.className = 'err'; next(); };
      xhr.send(f);
    }
    next();
  }

  el('up').onclick = function () { if (parent) load(parent); };
  el('mkdir').onclick = function () {
    var name = prompt('Folder name');
    if (name) api('/api/mkdir?path=' + q(cwd) + '&name=' + q(name), { method: 'POST' }).then(function () { load(cwd); }, alertErr);
  };
  el('pick').onclick = function () { el('file').click(); };
  el('file').onchange = function () { upload(this.files); this.value = ''; };
  el('roots').onchange = function () { load(this.value); };
  var drop = el('drop');
  ['dragenter', 'dragover'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  document.addEventListener('drop', function (e) { if (e.dataTransfer.files.length) upload(e.dataTransfer.files); });

  api('/api/roots').then(function (roots) {
    var sel = el('roots');
    roots.forEach(function (r) { var o = document.createElement('option'); o.value = r.path; o.textContent = r.name; sel.appendChild(o); });
    if (roots.length) load(roots[0].path);
  }, alertErr);
})();
</script>
</body>
</html>
