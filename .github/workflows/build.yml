name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        # Undo a bad update: rebuild an earlier commit. It gets this run's (higher) build number,
        # so every TV treats it as an update and installs it like any other.
        description: "Commit to re-release (leave empty for the branch's newest)"
        required: false
        default: ""

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APKs
        # The build number becomes the version, so the app's updater can tell newer releases apart.
        run: ./gradlew --no-daemon assembleDebug assembleRelease -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: WoodruffFamily-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Prepare release APK
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/release/*.apk WoodruffFamily.apk
          # Older names too, so links (and short links) made for earlier versions keep working.
          for old in WoodruffFilms WoodruffPictures WoodruffShows TVExplorer; do cp WoodruffFamily.apk "$old.apk"; done
      # The speed profile (.dm) for each Android version, from this same build, named by the lowest API
      # level it serves: the TVs' updater installs the right one together with the update, so Android
      # compiles the new code as it installs instead of overnight. Never holds up a release: without
      # them, updates install as before.
      - name: Prepare speed profiles
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set +e
          rm -f WoodruffFamily-api*.dm
          out=app/build/outputs/apk/release
          ls -lR "$out"
          # AGP writes them next to the APK and lists the API levels each one serves in output-metadata.json.
          python3 - "$out" <<'EOF'
          import json, os, shutil, sys, zipfile
          out = sys.argv[1]
          try:
              with open(os.path.join(out, "output-metadata.json")) as f:
                  meta = json.load(f)
          except Exception as e:
              sys.exit(f"Couldn't read output-metadata.json: {e}")
          apks = {os.path.splitext(e.get("outputFile", ""))[0] for e in meta.get("elements") or []}
          found = []
          for e in meta.get("baselineProfiles") or []:
              dms = e.get("baselineProfiles") or []
              if not isinstance(e.get("minApi"), int) or not dms:
                  continue
              src = next((p for p in dms if os.path.splitext(os.path.basename(p))[0] in apks), dms[0])
              try:
                  with zipfile.ZipFile(os.path.join(out, src)) as z:
                      z.getinfo("primary.prof")
                  found.append((e["minApi"], e.get("maxApi"), src))
              except Exception as x:
                  print(f"Left out {src}: {x}")
          print(f"output-metadata.json lists {len(found)} usable speed profile(s)")
          starts = {lo for lo, _, _ in found}
          for lo, hi, src in found:
              # Its highest API level goes in the name too, if the next one doesn't start right after it.
              name = f"WoodruffFamily-api{lo}.dm"
              if isinstance(hi, int) and hi < 2**31 - 1 and hi + 1 not in starts:
                  name = f"WoodruffFamily-api{lo}-{hi}.dm"
              shutil.copyfile(os.path.join(out, src), name)
              print(f"{name}: API {lo} to {hi}, from {src}")
          EOF
          # None from AGP: make them from the APK's own profile with the SDK's profgen.
          if ! ls WoodruffFamily-api*.dm > /dev/null 2>&1; then
            profgen=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/profgen 2> /dev/null | head -n 1)
            echo "Trying profgen: ${profgen:-not found}"
            if [ -n "$profgen" ]; then
              "$profgen" extractProfile --apk WoodruffFamily.apk --output-dex-metadata WoodruffFamily-api28-30.dm --profile-format V0_1_0_P
              "$profgen" extractProfile --apk WoodruffFamily.apk --output-dex-metadata WoodruffFamily-api31.dm --profile-format V0_1_5_S
            fi
          fi
          # Only well-formed ones (a zip holding primary.prof) go out with the release.
          for f in WoodruffFamily-api*.dm; do
            [ -f "$f" ] || continue
            if ! python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).getinfo("primary.prof")' "$f" 2> /dev/null; then
              echo "Left out $f: not a speed profile"; rm -f "$f"
            fi
          done
          if ls WoodruffFamily-api*.dm > /dev/null 2>&1; then
            echo "Speed profiles for this release:"; ls -l WoodruffFamily-api*.dm
          else
            echo "No speed profiles for this release: updates install without one, as before."
          fi
          exit 0
      # Builds can finish out of order; only the build of the branch's newest commit becomes
      # "latest", so the stable link never goes back to an older APK. The gallery job's own
      # "Update UI gallery" commits land on top of this one and don't count.
      - name: Is this the newest commit?
        id: head
        if: github.event_name != 'pull_request'
        run: |
          # A re-release (undo) is always meant to become the latest.
          if [ -n "${{ inputs.ref }}" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=50 origin "$GITHUB_REF_NAME"
          newer=$(git log --format=%s "$GITHUB_SHA..FETCH_HEAD" | grep -v '^Update UI gallery' || true)
          if [ -z "$newer" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
      # Gives a stable download link: /releases/latest/download/WoodruffFamily.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: v2.0.${{ github.run_number }}
          # "rollback" tells the TVs to install it right away instead of waiting a day: re-releases, and
          # urgent fixes (a commit message with "[urgent]") that every TV needs now.
          name: Woodruff Family 2.0 (build ${{ github.run_number }})${{ (inputs.ref || contains(github.event.head_commit.message, '[urgent]')) && ' · rollback' || '' }}
          target_commitish: ${{ inputs.ref || github.sha }}
          make_latest: ${{ steps.head.outputs.latest }}
          files: |
            WoodruffFamily.apk
            WoodruffFilms.apk
            WoodruffPictures.apk
            WoodruffShows.apk
            TVExplorer.apk
            WoodruffFamily-api*.dm
          body: |
            Install on Android TV: download WoodruffFamily.apk, or type this into the Downloader app on the TV:
            https://github.com/${{ github.repository }}/releases/latest/download/WoodruffFamily.apk

  # UI gallery: draws every TV screen (Robolectric, no device needed) and every phone-app tab
  # (headless Chromium), light and dark, and publishes them to GitHub Pages at /ui/.
  # Runs beside the APK build, so a drawing problem never holds up a release.
  gallery:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only the newest push's gallery matters: cancel an older one still running.
    concurrency:
      group: gallery-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Draw TV screens
        run: ./gradlew --no-daemon testDebugUnitTest -Pgallery --tests '*.gallery.*'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw phone app
        working-directory: tools/gallery
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          python3 mock_server.py ../../app/src/main/assets/web &
          sleep 2
          node phone.mjs ../../build/gallery
      - name: Publish to GitHub Pages
        run: |
          pip install --quiet pillow
          # Build the gallery outside the checkout, then lay it over the latest branch each try:
          # never merge (binary images can't be merged when two runs overlap).
          python3 tools/gallery/publish.py build/gallery "$RUNNER_TEMP/ui" "${{ github.run_number }}" "${GITHUB_SHA::7}"
          cp docs/ui/index.html docs/ui/favicon.png "$RUNNER_TEMP/ui/"
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            rm -rf docs/ui/img docs/ui/gallery.json
            mkdir -p docs/ui && cp -r "$RUNNER_TEMP/ui/img" "$RUNNER_TEMP/ui/gallery.json" docs/ui/
            git add -A docs/ui
            if git diff --cached --quiet; then echo "Gallery unchanged"; exit 0; fi
            git commit -q -m "Update UI gallery (build ${{ github.run_number }}) [skip ci]"
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-gallery
          path: build/gallery
          if-no-files-found: ignore
