name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: WoodruffFilms-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Prepare release APK
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/release/*.apk WoodruffFilms.apk
          # Older names too, so links (and short links) made for earlier versions keep working.
          cp WoodruffFilms.apk WoodruffPictures.apk
          cp WoodruffFilms.apk WoodruffShows.apk
          cp WoodruffFilms.apk TVExplorer.apk
      # Gives a stable download link: /releases/latest/download/WoodruffFilms.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: v1.8.${{ github.run_number }}
          name: Woodruff Films 1.8 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            WoodruffFilms.apk
            WoodruffPictures.apk
            WoodruffShows.apk
            TVExplorer.apk
          body: |
            Install on Android TV: download WoodruffFilms.apk, or type this into the Downloader app on the TV:
            https://github.com/${{ github.repository }}/releases/latest/download/WoodruffFilms.apk
